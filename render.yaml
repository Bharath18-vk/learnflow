services:
  # -------------------------------------------------------------
  # Backend API Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: learnwise-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

  # -------------------------------------------------------------
  # Frontend Web Client (React 19 / Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: learnwise-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: learnwise-api
          property: host
